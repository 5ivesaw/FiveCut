<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">FiveCut desktop video editor</title>
  <desc id="description">FiveCut logo and an orange-accented video editing timeline on a dark background.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="85%">
      <stop offset="0" stop-color="#6b2708"/>
      <stop offset=".42" stop-color="#17100c"/>
      <stop offset="1" stop-color="#090807"/>
    </radialGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
