name: FiveCut CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fivecut-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    name: Download site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate site
        run: |
          python3 tools/validate_site.py
          node --check site/app.js

  contracts:
    name: Agent contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Validate JSON files
        run: |
          jq empty \
            packages/editor-api/fivecut.config.json \
            packages/editor-api/schemas/fivecut-project.schema.json \
            packages/editor-api/schemas/fivecut-command-package.schema.json
      - name: Compile Python agent tools
        run: python3 -m compileall -q tools/fivecut_agent
      - name: Test agent contracts and renderer
        run: python3 -m unittest discover -s tools/fivecut_agent/tests -v

  rust:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --locked
      - name: Test
        run: cargo test --workspace --locked

  wasm:
    name: Browser WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - name: Install verified wasm-pack
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/wasm-pack.tar.gz"
          destination="${RUNNER_TEMP}/wasm-pack"
          curl --fail --location --retry 3 \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz" \
            --output "${archive}"
          echo "c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a  ${archive}" \
            | sha256sum --check -
          mkdir -p "${destination}"
          tar --extract --gzip --file "${archive}" \
            --directory "${destination}" --strip-components=1
          echo "${destination}" >> "${GITHUB_PATH}"
      - name: Build local editor WebAssembly
        run: wasm-pack build rust/wasm --target bundler --out-dir pkg --release
      - uses: actions/upload-artifact@v4
        with:
          name: fivecut-wasm
          path: rust/wasm/pkg
          if-no-files-found: error

  web:
    name: Web editor
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: wasm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fivecut-wasm
          path: rust/wasm/pkg
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18
      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate content and route types
        working-directory: apps/web
        run: bun --bun x next typegen
      - name: Typecheck with the web workspace compiler
        working-directory: apps/web
        run: bun x tsc --noEmit
      - name: Unit tests
        run: bun test
      - name: Production build
        run: bun run build:web
        env:
          FIVECUT_OFFLINE: "1"
